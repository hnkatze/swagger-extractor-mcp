version: 2

project_name: swagger-mcp

builds:
  - main: ./cmd/swagger-mcp/
    binary: swagger-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.serverVersion={{ .Version }}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    # Conventional-commit types, with or without a scope: "docs: x" and
    # "docs(odd): x" must both be excluded. The previous patterns were
    # "^docs:" and friends, which only matched the unscoped form, so scoped
    # docs/chore/test commits leaked into the release notes.
    exclude:
      - "^docs(\\([^)]*\\))?!?:"
      - "^chore(\\([^)]*\\))?!?:"
      - "^style(\\([^)]*\\))?!?:"
      - "^test(\\([^)]*\\))?!?:"
